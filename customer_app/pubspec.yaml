name: customer_app
description: PVL Mart Customer App
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  http: ^1.1.0
  shared_preferences: ^2.2.0
  provider: ^6.0.0
  google_fonts: ^6.0.0
  razorpay_flutter: ^1.4.6
  socket_io_client: ^2.0.3+1

  # For live tracking map
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Firebase (Google Sign-In ready; not fully configured yet)
  firebase_core: ^2.24.2
  firebase_auth: ^4.17.4
  google_sign_in: ^6.2.1
  qr_flutter: ^4.1.0
  geolocator: ^12.0.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
flutter_launcher_icons:
  android: true
  ios: false
  web:
    generate: true
    image_path: "assets/app_icon.png"
    background_color: "#ffffff"
    theme_color: "#1e7a3e"
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/app_icon.png"
  remove_alpha_ios: true

name: customer_app
description: "PVL Mart Customer App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  animated_bottom_navigation_bar: ^1.3.2
  fluttertoast: ^8.2.4
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  flutter_secure_storage: ^9.0.0   # optional

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

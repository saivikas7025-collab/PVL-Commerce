# --- Memory settings tuned for 8 GB Windows machines ---
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.daemon=false
org.gradle.configureondemand=true
org.gradle.caching=true
org.gradle.workers.max=2

# Kotlin compiler daemon ? smaller heap
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m

# Android
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false

# Use JDK 17 (matches app/build.gradle.kts)
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-17.0.20.101-hotspot

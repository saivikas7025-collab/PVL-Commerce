name: admin_dashboard
description: "PVL Commerce Admin Dashboard"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  webview_flutter: ^4.14.1
  http: ^1.6.0
  socket_io_client: ^3.1.6
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  fl_chart: ^1.2.0
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  google_sign_in: 6.3.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/index.html
flutter_launcher_icons:
  android: true
  ios: false
  web:
    generate: true
    image_path: "assets/app_icon.png"
    background_color: "#ffffff"
    theme_color: "#1e7a3e"
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/app_icon.png"
  remove_alpha_ios: true

name: store_dashboard
description: "PVL Commerce Store Dashboard"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  socket_io_client: ^3.1.6
  webview_flutter: ^4.14.1
  audioplayers: ^6.8.1
  geolocator: ^14.0.3
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  google_sign_in: 6.3.0
  mobile_scanner: ^5.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/index.html
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  web:
    generate: true
    image_path: "assets/app_icon.png"
    background_color: "#ffffff"
    theme_color: "#1e7a3e"
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/app_icon.png"
  remove_alpha_ios: true
